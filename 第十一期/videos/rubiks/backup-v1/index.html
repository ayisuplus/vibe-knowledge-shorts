<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>魔方——上帝的玩具</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/js/captions.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.js", "three/addons/": "./assets/vendor/addons/" } }</script>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/film.css">
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="78">
      <audio id="music" src="assets/music.m4a" data-start="0" data-duration="77.99" data-track-index="9" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.mp3" data-start="0" data-duration="78" data-track-index="10" data-volume="0.85"></audio>
      <!-- 开场的手（MiniMax H3 生成，i2v 1202，末尾补了 3.2 秒定格）。3D 画布在它上面，背景透明 -->
      <video id="hand" class="clip" src="assets/video/hand-open-ext.mp4" data-start="0" data-duration="9.08" data-track-index="2" muted playsinline
        style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:0"></video>
      <div id="stage" class="layer clip" data-start="0" data-duration="78" data-track-index="0" style="z-index:1">
        <canvas id="gl" width="1920" height="1080"></canvas>
      </div>
      <div id="hud" class="layer clip" data-start="0" data-duration="78" data-track-index="1" style="z-index:2"></div>
    </div>
    <script>
      // 时间线先在这里注册（框架加载时就要找到它）；3D 模块加载后往里填驱动 tween
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="assets/js/film.js"></script>
  </body>
</html>
