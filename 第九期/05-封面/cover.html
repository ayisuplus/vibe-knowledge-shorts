<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面</title>
<!-- 封面：背景是成片 6.88 秒那一帧（仓库墙 + .md 标签一起闪），2 倍截图 bg.jpg（3840×2160）。
     ?a=43 → 1440×1080，?a=34 → 1080×1440。标题和问句叠在上面。 -->
<style>
  @font-face { font-family: "NotoSC"; src: url("../videos/markdown/assets/fonts/NotoSansSC-VF.ttf"); font-weight: 100 900; }
  @font-face { font-family: "CMono"; src: url("../videos/markdown/assets/fonts/CascadiaMono.ttf"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #EBEEF2; }
  #root { position: relative; overflow: hidden; background: #EBEEF2; }
  #bg { position: absolute; width: 1920px; height: 1080px; background: url("bg.jpg") 0 0 / 1920px 1080px no-repeat; transform-origin: 0 0; }
  .veil { position: absolute; left: 0; right: 0; top: 0; }
  .title { position: absolute; left: 0; right: 0; text-align: center; font: 900 120px/1.18 "NotoSC"; color: #1F2328; letter-spacing: 4px;
    text-shadow: 0 0 28px rgba(247, 248, 250, 1), 0 0 8px rgba(247, 248, 250, 1); }
  .title .mono { font-family: "CMono", monospace; font-weight: 700; letter-spacing: 0; }
  .title em { font-style: normal; color: #B05000; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; }
  .sub span { display: inline-block; padding: 14px 40px; border-radius: 999px; background: #fff; border: 4px solid #B05000; font: 800 54px "NotoSC"; color: #1F2328;
    box-shadow: 0 16px 40px -14px rgba(31, 35, 40, .45), 0 0 0 10px rgba(176, 80, 0, .12); }
  .sub b { font-family: "CMono", monospace; color: #B05000; }
</style>
</head>
<body>
<div id="root"><div id="bg"></div><div id="hud"></div></div>
<script>
  const portrait = /a=34/.test(location.search);
  const w = portrait ? 1080 : 1440, h = portrait ? 1440 : 1080;
  const root = document.getElementById("root"), bg = document.getElementById("bg");
  Object.assign(root.style, { width: w + "px", height: h + "px" });
  // 背景取景：让中央那团 .md 标签（成片坐标约 x 960、y 500）落在标题下方
  bg.style.transform = portrait ? "translate(-330px, 470px) scale(0.9)" : "translate(-240px, 150px) scale(1)";
  document.getElementById("hud").innerHTML = portrait
    ? `<div class="veil" style="height:620px;background:linear-gradient(rgba(247,248,250,.97) 0%,rgba(247,248,250,.9) 70%,rgba(247,248,250,0) 100%)"></div>
       <div class="title" style="top:70px"><span class="mono">Markdown</span><br><em>AI 的最爱</em></div>
       <div class="sub" style="top:400px"><span>这些 <b>.md</b>，到底是什么？</span></div>`
    : `<div class="veil" style="height:380px;background:linear-gradient(rgba(247,248,250,.97) 0%,rgba(247,248,250,.9) 62%,rgba(247,248,250,0) 100%)"></div>
       <div class="title" style="top:46px;font-size:112px"><span class="mono">Markdown</span>：<em>AI 的最爱</em></div>
       <div class="sub" style="top:226px"><span>这些 <b>.md</b>，到底是什么？</span></div>`;
</script>
</body>
</html>
