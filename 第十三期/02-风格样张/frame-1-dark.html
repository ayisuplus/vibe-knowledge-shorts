<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 A · 深夜机舱</title>
<style>
@font-face{font-family:NSSC;src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900;font-display:block}
@font-face{font-family:NSerif;src:url("assets/fonts/NotoSerifSC-VF.ttf") format("truetype");font-weight:200 900;font-display:block}
@font-face{font-family:WenKai;src:url("assets/fonts/LXGWWenKai-Regular.ttf") format("truetype");font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(62% 58% at 50% 42%,#111924 0%,#0a0e15 48%,#05060a 100%)}
svg.sheet{position:absolute;inset:0;width:1920px;height:1080px;transform:scale(1.14);transform-origin:50% 46%}
.rule{position:absolute;left:0;right:0;height:1px;background:rgba(111,211,232,.055)}
.caption{position:absolute;left:0;right:0;bottom:54px;text-align:center;font-family:NSerif;font-weight:600;
  font-size:56px;letter-spacing:.02em;color:#eef4fa;text-shadow:0 2px 34px rgba(0,0,0,.9)}
.caption em{font-style:normal;color:#ff8f5e}
.mode{position:absolute;left:104px;top:96px;font-family:NSSC;font-size:15px;letter-spacing:.42em;color:rgba(111,211,232,.55)}
.grain{position:absolute;inset:-40px;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 68% at 50% 44%,transparent 42%,rgba(0,0,0,.62) 100%)}
</style>
</head>
<body>
<div id="root">
<svg class="sheet" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#ff6b35"/>
    </marker>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fa"/><stop offset=".55" stop-color="#9fb4c9"/><stop offset="1" stop-color="#4d5f73"/>
    </linearGradient>
    <clipPath id="beltClip">
      <path d="M606 700 L1314 700 A46 46 0 0 1 1314 792 L606 792 A46 46 0 0 1 606 700 Z"/>
    </clipPath>
  </defs>

  <!-- 地面反光池 -->
  <ellipse cx="960" cy="800" rx="560" ry="150" fill="#6fd3e8" opacity=".07" filter="url(#soft)"/>

  <!-- ===== 跑步机 ===== -->
  <!-- 机身 + 皮带 -->
  <path d="M606 700 L1314 700 A46 46 0 0 1 1314 792 L606 792 A46 46 0 0 1 606 700 Z"
        fill="#0b1017" stroke="#2b4258" stroke-width="2"/>
  <g clip-path="url(#beltClip)">
    <!-- 走过的皮带节：糊成速度线 -->
    <g stroke="#6fd3e8" stroke-opacity=".30" stroke-width="3" filter="url(#soft)">
      <path d="M600 704 L600 788 M646 704 L646 788 M692 704 L692 788 M738 704 L738 788
               M784 704 L784 788 M830 704 L830 788 M876 704 L876 788 M922 704 L922 788
               M968 704 L968 788 M1014 704 L1014 788 M1060 704 L1060 788 M1106 704 L1106 788
               M1152 704 L1152 788 M1198 704 L1198 788 M1244 704 L1244 788 M1290 704 L1290 788"/>
    </g>
    <g stroke="#8fe3f5" stroke-opacity=".55" stroke-width="2">
      <path d="M600 704 L600 788 M646 704 L646 788 M692 704 L692 788 M738 704 L738 788
               M784 704 L784 788 M830 704 L830 788 M876 704 L876 788 M922 704 L922 788
               M968 704 L968 788 M1014 704 L1014 788 M1060 704 L1060 788 M1106 704 L1106 788
               M1152 704 L1152 788 M1198 704 L1198 788 M1244 704 L1244 788 M1290 704 L1290 788"/>
    </g>
    <!-- 皮带上的光带 -->
    <rect x="606" y="700" width="708" height="92" fill="url(#body)" opacity=".10"/>
  </g>
  <!-- 上沿光 -->
  <path d="M606 700 L1314 700" stroke="#6fd3e8" stroke-width="3" opacity=".9" filter="url(#glow)"/>
  <path d="M606 792 L1314 792" stroke="#6fd3e8" stroke-width="2" opacity=".5"/>

  <!-- 滚筒 -->
  <circle cx="606" cy="746" r="46" fill="#0b1017" stroke="#3c5a74" stroke-width="2.6"/>
  <circle cx="1314" cy="746" r="46" fill="#0b1017" stroke="#3c5a74" stroke-width="2.6"/>
  <circle cx="606" cy="746" r="8" fill="#6fd3e8" opacity=".8"/>
  <circle cx="1314" cy="746" r="8" fill="#6fd3e8" opacity=".8"/>

  <!-- 支腿 -->
  <path d="M640 792 L640 862 M1280 792 L1280 862" stroke="#3c5a74" stroke-width="3"/>
  <path d="M606 862 L674 862 M1246 862 L1314 862" stroke="#6fd3e8" stroke-width="4" opacity=".75" filter="url(#glow)"/>

  <!-- 立柱 + 仪表 -->
  <path d="M470 862 L470 286" stroke="#3c5a74" stroke-width="4"/>
  <path d="M436 862 L504 862" stroke="#6fd3e8" stroke-width="4" opacity=".55"/>
  <path d="M470 792 L606 792" stroke="#3c5a74" stroke-width="3"/>
  <rect x="452" y="190" width="216" height="96" rx="7" fill="#0a1620" stroke="#6fd3e8" stroke-width="2.2"/>
  <text x="560" y="228" text-anchor="middle" font-family="NSSC" font-size="15" letter-spacing="7" fill="#5b8fa8">跑道速度</text>
  <text x="536" y="272" text-anchor="middle" font-family="Consolas,monospace" font-size="62" font-weight="700"
        fill="#9ff0ff" filter="url(#glow)">2.4</text>
  <text x="600" y="272" font-family="Consolas,monospace" font-size="34" fill="#5b8fa8">×</text>

  <!-- ===== 人 ===== -->
  <ellipse cx="1004" cy="702" rx="118" ry="15" fill="#000" opacity=".55" filter="url(#soft)"/>
  <g transform="translate(876,277) scale(1.15)" fill="none" stroke="url(#body)" stroke-width="31"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 92 L104 116 L100 214 M100 214 L146 286 L156 366 M100 214 L58 264 L30 320 M104 116 L58 142 L44 92 M104 116 L152 150 L180 122"/>
    <circle cx="118" cy="54" r="30" fill="url(#body)" stroke="none"/>
  </g>

  <!-- ===== 及格线 ===== -->
  <path d="M300 400 L1620 400" stroke="#ff6b35" stroke-width="2.4" stroke-dasharray="28 14" opacity=".95" filter="url(#glow)"/>
  <text x="300" y="378" font-family="NSSC" font-size="20" letter-spacing="7" fill="#ff8f5e">及 格 线</text>
  <path d="M1560 542 L1560 400" stroke="#ff6b35" stroke-width="1.6" opacity=".45"/>
  <path d="M1560 470 L1560 400" stroke="#ff6b35" stroke-width="2.4" marker-start="url(#arR)" marker-end="url(#arR)"/>
  <text x="1536" y="576" text-anchor="end" font-family="NSSC" font-size="19" fill="#ff8f5e">每年上移一格</text>
</svg>

<div class="rule" style="top:150px"></div>
<div class="rule" style="top:960px"></div>
<div class="mode">2 0 2 6 · 第 十 三 期</div>
<div class="caption">社会进步了，为什么我<em>反而更累</em></div>
<div class="grain"></div>
<div class="vig"></div>
</div>
</body>
</html>
