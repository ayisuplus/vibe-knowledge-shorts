<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>
@font-face{font-family:NotoSC;src:url(../videos/unboxing/assets/fonts/NotoSansSC-VF.ttf);font-weight:100 900}
@font-face{font-family:WenKai;src:url(../videos/unboxing/assets/fonts/LXGWWenKai-Regular.ttf)}
*{box-sizing:border-box} html,body{margin:0;overflow:hidden;background:#07090f}
#c{position:absolute;inset:0;display:block}
.t{position:absolute;left:0;right:0;text-align:center;font-family:NotoSC,sans-serif;font-weight:900;color:#fffaf2;letter-spacing:.02em;line-height:1.18;text-shadow:0 4px 24px rgba(0,0,0,.9),0 0 40px rgba(7,9,15,.9)}
.t .hl{color:#ffcf8a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t" id="t">快递拆开以后，<br><span class="hl">快乐</span>去哪了？</div>
<script type="module">
// 封面复用片里的同一份道具代码（rig.js）：S1 签收那一刻——箱子打开，光正离开它。
import { box, orb, trail, glow, phone } from "../videos/unboxing/assets/js/rig.js";
import { bez, along } from "../videos/unboxing/assets/js/lib.js";
await Promise.all(["900 100px NotoSC", "700 40px NotoSC", "40px WenKai"].map((f) => document.fonts.load(f)));
const a = new URLSearchParams(location.search).get("a") || "43";
const W = a === "43" ? 1440 : 1080, H = a === "43" ? 1080 : 1440, dpr = window.devicePixelRatio || 1;
const cv = document.getElementById("c"); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
// 房间：墙、台灯暖光、桌面
const deskY = a === "43" ? 760 : 1020;
let g = ctx.createLinearGradient(0, 0, 0, deskY); g.addColorStop(0, "#1d2236"); g.addColorStop(1, "#10141f");
ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
glow(ctx, W * .85, 60, 900, 640, "rgba(255,179,71,A)", .16);
g = ctx.createLinearGradient(0, deskY, 0, H); g.addColorStop(0, "#1e2029"); g.addColorStop(1, "#0b0c11");
ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, deskY + 20); ctx.lineTo(W, deskY - 10); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
glow(ctx, W * .5, deskY + 90, 700, 170, "rgba(255,207,138,A)", .3);
// 打开的纸箱 + 正在离开的光
const bx = W * .5, by = deskY + (a === "43" ? 40 : 60), s = a === "43" ? 1.25 : 1.35;
if (a === "34") phone(ctx, 230, deskY - 150, -.12, { rows: [{ label: "已签收", sub: "刚刚", tone: "grey" }, { label: "派送中", sub: "已刷新 8 次", tone: "grey" }, { label: "已发货", sub: "昨天", tone: "done" }] });
box(ctx, bx, by, s, 1, 1, 1);
const mouth = [bx + 50 * s, by - 120 * s], dst = a === "43" ? [W * .8, H * .5] : [W * .74, H * .46];
const path = bez(mouth, [mouth[0] + 40, mouth[1] - 160], [dst[0] - 120, dst[1] + 20], dst, 40);
trail(ctx, (u) => along(path, u), .05, .97, 16, 11, 1);
orb(ctx, dst[0], dst[1], a === "43" ? 46 : 50, 1);
// 标题：缩到 300px 高仍要能读
const t = document.getElementById("t");
if (a === "43") { t.style.top = "70px"; t.style.fontSize = "124px"; }
else { t.style.top = "120px"; t.style.fontSize = "118px"; }
document.title = "ready";
</script>
</body>
</html>
