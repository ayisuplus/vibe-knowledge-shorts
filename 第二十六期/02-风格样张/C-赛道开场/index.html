<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>样张 C · 赛道开场</title>
<style>
@font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: NotoSC, sans-serif; }
.plate { position: absolute; inset: 0; background: url("assets/bg/track-1080.jpg") center / cover; transform: scale(1.06); transform-origin: 53% 22%; }
.grade { position: absolute; inset: 0; background: radial-gradient(ellipse at 53% 30%, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 100%), linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.65)); }
/* 灯：在照片里那排灯架上点亮（中间、下面两排），坐标按 1920 宽量出 */
.lamp { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle, #fff6f0 0 18%, #ff3b2a 40%, rgba(255,40,20,0) 72%); box-shadow: 0 0 18px 8px rgba(255,40,20,.85), 0 0 60px 26px rgba(255,30,10,.35); mix-blend-mode: screen; }
.glow { position: absolute; left: 52%; top: 24%; width: 760px; height: 240px; margin: -120px 0 0 -380px; background: radial-gradient(ellipse, rgba(255,40,20,.22), rgba(255,40,20,0) 70%); mix-blend-mode: screen; }
.note { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: 600; color: #d8e6ea; white-space: nowrap; text-shadow: 0 2px 10px #000; }
.caption { position: absolute; bottom: 58px; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 800; line-height: 1.28; color: #fff; text-shadow: 0 3px 16px #000; }
.caption .hi { color: #ffb454; }
.proc { position: absolute; left: 1020px; top: 120px; transform: translateX(-50%); font-size: 42px; font-weight: 800; color: #ffb454; text-shadow: 0 3px 14px #000; }
</style>
</head>
<body>
<div class="plate"></div>
<div class="glow"></div>
<div id="lamps"></div>
<div class="grade"></div>
<div class="note">2023 赛季 · 「恭喜维斯塔潘」是 F1 圈内玩笑</div>
<div class="proc">发车灯</div>
<div class="caption">2023 年，F1 圈里<br>流行这样一句话：</div>
<script>
// 照片缩放 1.06（以 53% 22% 为原点）后的灯位：五列，取中、下两排，前三列已亮
const X = [931, 975, 1020, 1064, 1108], Y = [239, 268], ox = 1920 * .53, oy = 1080 * .22, k = 1.06;
const box = document.getElementById("lamps");
X.slice(0, 3).forEach((x) => Y.forEach((y) => { const d = document.createElement("div"); d.className = "lamp"; d.style.left = (ox + (x - ox) * k) + "px"; d.style.top = (oy + (y - oy) * k) + "px"; box.appendChild(d); }));
window.__timelines = { main: { duration: () => 1, seek() {} } };
</script>
</body>
</html>
