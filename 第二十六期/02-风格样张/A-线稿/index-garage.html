<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>样张 A2 · 线稿＋P 房</title>
<style>
@font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05080d; font-family: NotoSC, sans-serif; }
#stage { position: absolute; inset: 0; }
.grid { position: absolute; inset: 0; opacity: .55; background:
  linear-gradient(rgba(120,170,230,.07) 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(90deg, rgba(120,170,230,.07) 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(rgba(120,170,230,.12) 1px, transparent 1px) 0 0 / 200px 200px,
  linear-gradient(90deg, rgba(120,170,230,.12) 1px, transparent 1px) 0 0 / 200px 200px; }
.plate { position: absolute; inset: -20px; background: url("assets/bg/garage-blur-deep.jpg") center / cover; }
.tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,12,24,.55), rgba(4,12,24,.72)); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(2,6,12,.75) 100%); }
.note { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: 600; color: #d8e6ea; white-space: nowrap; }
.caption { position: absolute; bottom: 58px; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 800; line-height: 1.28; color: #fff; text-shadow: 0 3px 16px #000; }
.caption .hi { color: #ffb454; }
.lbl { position: absolute; background: rgba(5,12,22,.85); border-left: 4px solid #ffb454; border-radius: 6px; padding: 8px 18px 10px; color: #fff; white-space: nowrap; }
.lbl .nm { font-size: 44px; font-weight: 800; line-height: 1.15; } .lbl .fn { font-size: 36px; font-weight: 500; color: #c9d3dd; }
.tb { position: absolute; right: 70px; top: 120px; border: 2px solid rgba(190,220,255,.55); color: #cfe3ff; font-size: 24px; }
.tb div { padding: 6px 16px; border-bottom: 1px solid rgba(190,220,255,.35); } .tb div:last-child { border: none; } .tb b { color: #fff; font-size: 30px; }
</style>
</head>
<body>
<div id="stage">
  <div class="plate"></div><div class="tint"></div><div class="grid"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb6e6"/></marker>
    </defs>
    <!-- 车身坐标：x 从车尾（尾翼后缘）向前，单位 mm；y 向上，地面 y=0。整体缩放 0.285，车尾放在 px 150，地面放在 py 800。-->
    <g transform="translate(150 800) scale(.285 -.285)" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <!-- 地面 -->
      <line x1="-300" y1="0" x2="5900" y2="0" stroke="#5f82ad" stroke-width="8"/>
      <!-- 车底隧道（隐藏线，示意）：入口高、喉部最低、扩散器抬起 -->
      <path d="M3880,260 C3500,200 3100,95 2500,80 C1900,80 1350,110 1050,200 C900,250 760,330 660,390" stroke="#ffb454" stroke-width="14.4" stroke-dasharray="40 26"/>
      <path d="M3880,60 L1060,60" stroke="#ffb454" stroke-width="8" opacity=".5"/>
      <!-- 车底板与防滑木条 -->
      <path d="M3920,70 L1080,70 M3900,40 L1100,40" stroke="#d8ecff" stroke-width="11.2"/>
      <path d="M3100,22 L1500,22" stroke="#d8ecff" stroke-width="8" opacity=".6"/>
      <!-- 尾翼：端板、主翼面、DRS 活动片、梁翼 -->
      <g stroke="#d8ecff" stroke-width="11.2">
        <path d="M40,455 C30,700 50,880 150,962 L655,962 C620,900 600,700 610,455 Z"/>
        <path d="M95,845 C250,858 450,850 610,815 L615,792 C450,825 250,830 98,820 Z"/>
        <path d="M110,930 C260,946 420,940 600,905 L605,880 C430,915 260,920 112,905 Z"/>
        <path d="M175,355 C300,372 430,370 560,350 L560,325 C430,343 300,346 178,330 Z"/>
      </g>
      <!-- 后防撞结构、变速箱、后悬架 -->
      <path d="M260,300 L640,300 L700,380 L1060,420 M260,300 L260,250 L620,250" stroke="#d8ecff" stroke-width="9.6"/>
      <g stroke="#d8ecff" stroke-width="8" opacity=".75"><path d="M700,520 L1000,470 M700,520 L860,560 M700,200 L1000,250 M700,200 L880,170"/></g>
      <path d="M3060,958 C2760,935 2380,820 1980,660 C1600,520 1150,440 700,385 L700,300 L1080,70 L3920,70 L3920,120 C4000,250 4200,320 4420,310 C4750,290 5150,245 5420,212 C5480,205 5530,215 5545,238 C5500,255 5420,285 5300,330 C5050,420 4700,530 4420,590 C4100,650 3850,690 3700,700 L3470,700 C3480,800 3440,895 3345,895 C3260,895 3190,800 3200,700 L3120,700 C3130,860 3110,930 3060,958 Z" fill="rgba(120,170,230,.07)" stroke="none"/>
      <!-- 发动机盖：从防滚架一路下压到车尾（下压式车身） -->
      <path d="M3060,958 C2760,935 2380,820 1980,660 C1600,520 1150,440 700,385" stroke="#d8ecff" stroke-width="12.8"/>
      <path d="M3060,958 C3110,930 3130,860 3120,760" stroke="#d8ecff" stroke-width="12.8"/>
      <ellipse cx="3085" cy="880" rx="28" ry="55" stroke="#d8ecff" stroke-width="8"/>
      <!-- 侧箱：进气口高而窄，下方深度下切，顶面急降到车尾（RB19 的特征） -->
      <path d="M3560,545 C3300,575 2780,560 2520,505 C2180,430 1760,250 1180,120" stroke="#d8ecff" stroke-width="12.8"/>
      <path d="M3560,545 C3600,520 3605,360 3560,335" stroke="#d8ecff" stroke-width="12.8"/>
      <path d="M3560,335 C3330,235 3000,190 2700,185 C2350,182 2050,120 1700,80" stroke="#7fd0ff" stroke-width="11.2"/>
      <path d="M3540,520 C3560,470 3560,390 3540,355" stroke="#d8ecff" stroke-width="6.4" opacity=".6"/>
      <!-- 座舱、头盔、Halo -->
      <path d="M3120,700 L3700,700" stroke="#d8ecff" stroke-width="9.6"/>
      <path d="M3200,700 C3190,800 3260,895 3345,895 C3440,895 3480,800 3470,700" stroke="#d8ecff" stroke-width="11.2"/>
      <path d="M3250,790 L3465,800" stroke="#d8ecff" stroke-width="6.4" opacity=".7"/>
      <path d="M3785,640 C3760,760 3700,830 3540,845 C3360,858 3200,840 3120,812 L3110,700" stroke="#d8ecff" stroke-width="19.2"/>
      <!-- 后视镜 -->
      <path d="M3660,700 L3610,800 M3520,795 L3740,795 L3740,850 L3520,850 Z" stroke="#d8ecff" stroke-width="8"/>
      <!-- 单体壳与鼻锥 -->
      <path d="M3700,700 C3850,690 4100,650 4420,590 C4700,530 5050,420 5300,330 C5420,285 5500,255 5545,238" stroke="#d8ecff" stroke-width="12.8"/>
      <path d="M5545,238 C5530,215 5480,205 5420,212 C5150,245 4750,290 4420,310 C4200,320 4000,250 3920,120 L3920,70" stroke="#d8ecff" stroke-width="12.8"/>
      <!-- 前翼：四片翼面＋端板 -->
      <g stroke="#d8ecff" stroke-width="9.6">
        <path d="M5120,95 C5300,90 5480,92 5610,108 L5605,128 C5470,118 5300,118 5125,122 Z"/>
        <path d="M5040,158 C5200,160 5340,170 5450,190 L5440,208 C5330,192 5190,186 5045,182 Z"/>
        <path d="M4985,222 C5110,228 5220,245 5310,268 L5298,285 C5210,265 5100,250 4988,246 Z"/>
        <path d="M4955,288 C5040,296 5110,312 5170,334 L5158,350 C5100,330 5030,318 4958,312 Z"/>
        <path d="M4940,60 L5625,60 L5630,150 C5400,190 5150,280 4980,360 L4940,340 Z" opacity=".55"/>
      </g>
      <!-- 后轮、前轮 -->
      <g stroke="#d8ecff" stroke-width="17.6" fill="#0a1828">
        <circle cx="700" cy="360" r="360"/><circle cx="700" cy="360" r="232"/><circle cx="700" cy="360" r="40"/>
        <circle cx="4300" cy="360" r="360"/><circle cx="4300" cy="360" r="232"/><circle cx="4300" cy="360" r="40"/>
      </g>
      <g stroke="#d8ecff" stroke-width="6.4" opacity=".45"><circle cx="700" cy="360" r="300"/><circle cx="4300" cy="360" r="300"/></g>
      <!-- 前悬架：上横臂（前高后低＝抗点头）、下横臂、拉杆 -->
      <g stroke="#ffb454" stroke-width="11.2">
        <path d="M4300,560 L4520,655 M4300,560 L4080,500"/>
        <path d="M4300,175 L4560,250 M4300,175 L4040,215"/>
        <path d="M4310,520 L4120,230" stroke-dasharray="26 16"/>
      </g>
      <!-- 尺寸线：轴距（不标数字） -->
      <g stroke="#8fb6e6" stroke-width="6.4"><line x1="700" y1="-150" x2="4300" y2="-150" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="700" y1="-40" x2="700" y2="-200"/><line x1="4300" y1="-40" x2="4300" y2="-200"/></g>
    </g>
    <text x="663" y="863" fill="#8fb6e6" font-size="26" font-family="NotoSC">轴距</text>
    <!-- 引线 -->
    <g stroke="#e8ebef" stroke-width="2" fill="#fff">
      <line x1="830" y1="777" x2="700" y2="610"/><circle cx="830" cy="777" r="5"/>
      <line x1="1050" y1="735" x2="1180" y2="560"/><circle cx="1050" cy="735" r="5"/>
      <line x1="1376" y1="638" x2="1500" y2="520"/><circle cx="1376" cy="638" r="5"/>
    </g>
  </svg>
  <div class="lbl" style="left:330px;top:500px"><div class="nm">车底 · 两条隧道</div><div class="fn">虚线：藏在车底的通道</div></div>
  <div class="lbl" style="left:1050px;top:450px"><div class="nm">侧箱下切</div><div class="fn">把气流引向车底和车尾</div></div>
  <div class="lbl" style="left:1500px;top:410px"><div class="nm">前悬架</div><div class="fn">前高后低：刹车不点头</div></div>
  <div class="tb"><div><b>RB19</b>　2023</div><div>侧视 · 示意</div><div>比例与形状为示意</div></div>
  <div class="vig"></div>
  <div class="note">外形参考公开照片 · 线稿为示意</div>
  <div class="caption">它最厉害的地方，<br>你一眼根本<span class="hi">看不见</span>。</div>
</div>
<script>window.__timelines = { main: { duration: () => 1, seek() {} } };</script>
</body>
</html>
