<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 A · 粉色顶峰</title>
<style>
@font-face { font-family: "NSans"; src: url("fonts/NotoSansSC-VF.ttf"); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ff3d8b; }
svg { display: block; }
text { font-family: "NSans", sans-serif; }
.tag { font-size: 25px; font-weight: 800; fill: #3a0619; }
.lbl { font-size: 24px; font-weight: 700; fill: #7a0f3d; }

<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
    <circle cx="17" cy="17" r="7" fill="#ff5ea0"/>

    <rect width="22" height="22" fill="#ff8dbb"/>
    <circle cx="11" cy="11" r="3.4" fill="#ffd0e3"/>
  </pattern>
  <filter id="cut" x="-25%" y="-25%" width="150%" height="150%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
    <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="outline"/>
    <feGaussianBlur in="d" stdDeviation="7" result="b"/><feOffset in="b" dx="6" dy="10" result="o"/>
    <feFlood flood-color="#7a0f3d" flood-opacity="0.38"/><feComposite in2="o" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>

  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="8" dy="14" result="o"/>
    <feFlood flood-color="#7a0f3d" flood-opacity="0.35"/><feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <g id="tab">
    <rect x="-13" y="-16" width="26" height="30" rx="5" fill="#ffffff"/>
    <line x1="-13" y1="12" x2="13" y2="12" stroke="#f3b6cd" stroke-width="2" stroke-dasharray="4 3"/>

<!-- background: halftone plastic pink -->

<!-- blister card -->

<g transform="translate(762 214) scale(0.86)">

<g transform="translate(110 470) rotate(4)">
