<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 B · 觉醒也有价签</title>
<style>
@font-face { font-family: "NSerif"; src: url("fonts/NotoSerifSC-VF.ttf"); font-weight: 200 900; }
@font-face { font-family: "NSans"; src: url("fonts/NotoSansSC-VF.ttf"); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e6dac5; }
svg { display: block; }
text { font-family: "NSerif", serif; }
.tag { font-size: 26px; font-weight: 500; fill: #3b3128; letter-spacing: 1px; }
.prod { font-size: 26px; font-weight: 500; fill: #3b3128; letter-spacing: 3px; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
  </filter>
  <filter id="cut" x="-25%" y="-25%" width="150%" height="150%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
    <feFlood flood-color="#fbf7ef"/><feComposite in2="d" operator="in" result="outline"/>
    <feGaussianBlur in="d" stdDeviation="7" result="b"/><feOffset in="b" dx="6" dy="10" result="o"/>
    <feFlood flood-color="#5c4a2e" flood-opacity="0.22"/><feComposite in2="o" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="drained" x="-25%" y="-25%" width="150%" height="150%">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncR type="linear" slope="0.8" intercept="0.12"/><feFuncG type="linear" slope="0.8" intercept="0.12"/><feFuncB type="linear" slope="0.8" intercept="0.11"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="6" dy="12" result="o"/>
    <feFlood flood-color="#5c4a2e" flood-opacity="0.2"/><feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <g id="tab">
    <rect x="-13" y="-16" width="26" height="30" rx="5" fill="#fbf7ef"/>
    <line x1="-13" y1="12" x2="13" y2="12" stroke="#cdbb9c" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <g id="body">
    <path d="M118 120 Q118 26 200 28 Q282 26 282 120 L286 214 Q264 226 248 208 L248 140 Q200 118 152 140 L152 208 Q136 226 114 214 Z" fill="#3a2230"/>
    <rect x="148" y="480" width="46" height="370" rx="22" fill="#f1cdb8"/>
    <rect x="206" y="480" width="46" height="370" rx="22" fill="#f1cdb8"/>
    <ellipse cx="166" cy="852" rx="32" ry="15" fill="#f1cdb8"/>
    <ellipse cx="234" cy="852" rx="32" ry="15" fill="#f1cdb8"/>
    <rect x="94" y="234" width="36" height="290" rx="18" fill="#f1cdb8" transform="rotate(9 112 234)"/>
    <rect x="270" y="234" width="36" height="290" rx="18" fill="#f1cdb8" transform="rotate(-9 288 234)"/>
    <rect x="184" y="170" width="32" height="70" rx="12" fill="#f1cdb8"/>
    <path d="M135 232 Q200 212 265 232 L258 478 Q200 496 142 478 Z" fill="#f1cdb8"/>
    <circle cx="200" cy="118" r="72" fill="#f1cdb8"/>
    <path d="M130 104 Q148 38 200 40 Q252 38 270 104 Q234 84 200 94 Q166 82 130 104 Z" fill="#3a2230"/>
    <circle cx="176" cy="126" r="5.5" fill="#3a2230"/>
    <circle cx="224" cy="126" r="5.5" fill="#3a2230"/>
    <path d="M188 158 Q200 164 212 158" fill="none" stroke="#8a5a4a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="ptag">
    <path d="M0 0 L170 0 L170 58 L0 58 L-20 29 Z" fill="#d6c09a"/>
    <circle cx="-5" cy="29" r="5" fill="#e6dac5"/>
  </g>
</defs>

<!-- background paper -->
<rect width="1920" height="1080" fill="#e6dac5"/>

<!-- the whole frame is itself a product card (self-reference seed) -->
<g filter="url(#soft)">
  <rect x="70" y="44" width="1780" height="992" rx="30" fill="#f2ebdf"/>
</g>
<rect x="915" y="70" width="90" height="26" rx="13" fill="#e6dac5"/>
<g transform="translate(1660 930)" opacity="0.75">
  <rect x="0" y="0" width="4" height="60" fill="#3b3128"/><rect x="8" y="0" width="2" height="60" fill="#3b3128"/>
  <rect x="14" y="0" width="6" height="60" fill="#3b3128"/><rect x="24" y="0" width="2" height="60" fill="#3b3128"/>
  <rect x="30" y="0" width="4" height="60" fill="#3b3128"/><rect x="38" y="0" width="8" height="60" fill="#3b3128"/>
  <rect x="50" y="0" width="2" height="60" fill="#3b3128"/><rect x="56" y="0" width="4" height="60" fill="#3b3128"/>
  <rect x="64" y="0" width="2" height="60" fill="#3b3128"/><rect x="70" y="0" width="6" height="60" fill="#3b3128"/>
  <rect x="80" y="0" width="2" height="60" fill="#3b3128"/><rect x="86" y="0" width="4" height="60" fill="#3b3128"/>
  <rect x="94" y="0" width="8" height="60" fill="#3b3128"/><rect x="106" y="0" width="2" height="60" fill="#3b3128"/>
  <rect x="112" y="0" width="4" height="60" fill="#3b3128"/><rect x="120" y="0" width="2" height="60" fill="#3b3128"/>
</g>

<!-- drained pile of everything she took off -->
<g filter="url(#drained)" transform="translate(-20 -110)">
  <g transform="translate(250 760) rotate(-14)" filter="url(#cut)">
    <path d="M30 0 L50 -14 L70 0 L90 -14 L110 0 L104 70 L36 70 Z" fill="#ffb3d1"/>
    <path d="M36 70 L104 70 L176 196 Q70 222 -36 196 Z" fill="#ffc4db"/>
  </g>
  <g transform="translate(470 860) rotate(8)" filter="url(#cut)">
    <rect x="0" y="0" width="168" height="78" rx="12" fill="#ff1f73"/>
    <line x1="34" y1="8" x2="34" y2="70" stroke="#ffd0e3" stroke-width="5"/>
    <line x1="134" y1="8" x2="134" y2="70" stroke="#ffd0e3" stroke-width="5"/>
  </g>
  <g transform="translate(560 740) rotate(-20)" filter="url(#cut)">
    <path d="M0 52 L12 12 L32 40 L50 0 L68 40 L88 12 L100 52 Z" fill="#fcee0a"/>
  </g>
  <g transform="translate(150 640) rotate(-6)" filter="url(#cut)">
    <rect x="0" y="0" width="300" height="160" rx="18" fill="#ffe3ee"/>
    <rect x="0" y="0" width="300" height="50" rx="18" fill="#ff6aa6"/>
    <rect x="34" y="78" width="232" height="22" rx="11" fill="#ff2e7e"/>
  </g>
  <g transform="translate(400 690) rotate(24)" filter="url(#cut)">
    <rect x="0" y="40" width="44" height="80" rx="6" fill="#3a0619"/>
    <path d="M6 40 L6 6 Q22 -14 38 6 L38 40 Z" fill="#e0004f"/>
  </g>
  <g transform="translate(120 880) rotate(10)" filter="url(#cut)">
    <path d="M0 0 L190 0 L190 60 L0 60 L-22 30 Z" fill="#ffffff"/>
    <text x="95" y="40" text-anchor="middle" font-family="NSans" font-size="25" font-weight="800" fill="#3a0619">¥ 50,000+</text>
  </g>
  <g transform="translate(640 940) rotate(-8)" filter="url(#cut)">
    <path d="M0 0 L176 0 L176 60 L0 60 L-22 30 Z" fill="#ffffff"/>
    <text x="88" y="40" text-anchor="middle" font-family="NSans" font-size="25" font-weight="800" fill="#3a0619">¥ 20,000</text>
  </g>
</g>

<!-- the doll, plain now: white tee with slogan, still on paper tabs -->
<g transform="translate(790 150) scale(0.86)">
  <g filter="url(#cut)"><use href="#body"/></g>
  <g filter="url(#cut)">
    <path d="M150 480 L250 480 L262 840 L210 840 L200 560 L190 840 L138 840 Z" fill="#c9b79a"/>
    <use href="#tab" x="130" y="700"/><use href="#tab" x="270" y="700"/>
  </g>
  <g filter="url(#cut)">
    <path d="M134 232 Q200 214 266 232 L320 318 L278 346 L270 316 L272 500 L128 500 L130 316 L122 346 L80 318 Z" fill="#fbf8f2"/>
    <text x="200" y="372" text-anchor="middle" font-size="32" font-weight="600" fill="#3b3128" letter-spacing="4">做自己</text>
    <use href="#tab" x="146" y="220"/><use href="#tab" x="254" y="220"/>
    <use href="#tab" x="128" y="470"/><use href="#tab" x="272" y="470"/>
  </g>
</g>

<!-- price tag on the tee -->
<path d="M1050 438 Q1120 470 1160 448" fill="none" stroke="#8a7354" stroke-width="2.5"/>
<g transform="translate(1166 420) rotate(-4)" filter="url(#soft)">
  <use href="#ptag"/>
  <text x="85" y="39" text-anchor="middle" class="tag">¥ 799</text>
</g>

<!-- awakening products, same paper tabs, same strings -->
<g transform="translate(1340 150) rotate(3)">
  <g filter="url(#cut)">
    <rect x="0" y="0" width="190" height="260" rx="6" fill="#d9c7a7"/>
    <rect x="0" y="0" width="22" height="260" fill="#bfa77f"/>
    <text x="106" y="96" text-anchor="middle" class="prod">成为</text>
    <text x="106" y="140" text-anchor="middle" class="prod">你自己</text>
    <line x1="60" y1="190" x2="152" y2="190" stroke="#8a7354" stroke-width="2"/>
    <use href="#tab" x="60" y="-14"/><use href="#tab" x="140" y="-14"/>
  </g>
  <path d="M190 200 Q230 220 250 250" fill="none" stroke="#8a7354" stroke-width="2.5"/>
  <g transform="translate(254 236) rotate(6)" filter="url(#soft)"><use href="#ptag"/><text x="85" y="39" text-anchor="middle" class="tag">¥ 59</text></g>
</g>

<g transform="translate(1330 520) rotate(-3)">
  <g filter="url(#cut)">
    <rect x="0" y="0" width="360" height="190" rx="14" fill="#efe5d4"/>
    <text x="180" y="70" text-anchor="middle" class="prod">女性成长营</text>
    <line x1="120" y1="98" x2="240" y2="98" stroke="#8a7354" stroke-width="2"/>
    <text x="180" y="146" text-anchor="middle" font-size="24" fill="#8a7354" letter-spacing="2">21 天 · 找回自我</text>
    <use href="#tab" x="-14" y="95"/><use href="#tab" x="374" y="95"/>
  </g>
  <path d="M300 190 Q320 230 300 262" fill="none" stroke="#8a7354" stroke-width="2.5"/>
  <g transform="translate(290 240) rotate(4)" filter="url(#soft)"><use href="#ptag"/><text x="85" y="39" text-anchor="middle" class="tag">¥ 8,800</text></g>
</g>

<g transform="translate(1110 770) rotate(6)">
  <g filter="url(#cut)">
    <path d="M40 0 Q40 -70 90 -70 Q140 -70 140 0" fill="none" stroke="#bfa77f" stroke-width="10"/>
    <rect x="0" y="0" width="180" height="150" rx="6" fill="#e3d4b9"/>
    <text x="90" y="88" text-anchor="middle" class="prod">独立</text>
  </g>
</g>

<!-- caption -->
<text x="960" y="1006" text-anchor="middle" font-size="40" font-weight="500" fill="#3b3128" letter-spacing="4">这一次，被打包出售的是“觉醒”</text>
<rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
</body>
</html>
