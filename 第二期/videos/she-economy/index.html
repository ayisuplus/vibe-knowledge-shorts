    <style>
      @font-face { font-family: "SESans"; src: url("assets/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "SESerif"; src: url("assets/fonts/NotoSerifSC-VF.ttf") format("truetype"); font-weight: 200 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff8f6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "SESans", sans-serif; background: #fff8f6; }
      .layer { position: absolute; inset: 0; }
      #bg { position: absolute; inset: 0; background-color: #FFF8F6; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      #cam-html { position: absolute; inset: 0; }
      svg text { font-family: "SESans"; }

      /* 年龄爆炸贴 */
      .age { position: absolute; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .age svg { position: absolute; inset: 0; }
      .age b { position: relative; font-size: 40px; font-weight: 900; color: #5A1A24; white-space: nowrap; }

      /* 问题标签 */
      .label { position: absolute; opacity: 0; display: block; }
      .label span { display: block; padding: 12px 30px; font-size: 48px; font-weight: 900; color: #5A1A24; white-space: nowrap; background: #fff; border: 5px solid #FF4D6D; border-radius: 10px; }
      .label.beige span { font-family: "SESerif"; font-weight: 600; color: #3B3128; border-color: #D6C09A; background: #FBF7EF; }

      /* 字幕 */
      .cap { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; opacity: 0; }
      .cap span { display: block; max-width: 1720px; padding: 12px 36px; font-size: 44px; font-weight: 700; line-height: 1.35; color: #fff; text-align: center; background: rgba(63, 12, 21, 0.88); border-radius: 14px; }
      .cap.note { bottom: 112px; }
      .cap.note span { font-size: 30px; font-weight: 600; padding: 8px 26px; background: rgba(63, 12, 21, 0.72); }
      .cap.serif span { font-family: "SESerif"; font-weight: 500; color: #FBF7EF; background: rgba(59, 49, 40, 0.88); }

      /* 大数字卡 */
      .stat { position: absolute; opacity: 0; display: block; padding: 22px 36px 26px; background: rgba(255, 255, 255, 0.93); border-radius: 28px; box-shadow: 0 10px 0 rgba(122, 31, 48, 0.16); }
      .stat b { display: block; font-weight: 900; line-height: 1; letter-spacing: -2px; white-space: nowrap; }
      .stat i { display: block; margin-top: 14px; font-style: normal; font-size: 40px; font-weight: 800; line-height: 1.3; }

      /* 片名 */
      .title { position: absolute; opacity: 0; display: block; }
    </style>
