<!doctype html>
<html><head><meta charset="utf-8"><title>Mythos veil test</title>
<style>html,body{margin:0;background:#050510;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<script type="module">
// Fable 与 Mythos 并排：Mythos 外裹一层面纱壳，壳上孔洞随时间缓慢开合，只在片刻露出底下发光的神话浮雕
// ?mythos=mythos/mythos-A-fixed.png&fable=fable/fable-final.jpg&t=秒
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

let s = 53; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const sp = []; for (let i = 0; i < 2500; i++) { const a = rnd() * 6.283, b = Math.acos(2 * rnd() - 1), R = 90; sp.push(R * Math.sin(b) * Math.cos(a), R * Math.cos(b), R * Math.sin(b) * Math.sin(a)); }
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xc8cde0, size: 0.12 })));

const SUN = new THREE.Vector3(-7, 5, 24);
const sun = new THREE.DirectionalLight(0xfff4ea, 3.3); sun.position.copy(SUN); scene.add(sun);
scene.add(new THREE.AmbientLight(0x30324a, 0.22));
const sunDir = SUN.clone().normalize();
const loader = new THREE.TextureLoader();
const tex = async (f) => { const t = await loader.loadAsync(f); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; };
const vs = 'varying vec3 n;varying vec3 v;varying vec3 wn;void main(){n=normalize(normalMatrix*normal);wn=normalize(mat3(modelMatrix)*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';
const atmo = (col) => new THREE.Mesh(new THREE.SphereGeometry(1.09, 128, 64), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { c: { value: new THREE.Color(col) }, s: { value: sunDir } }, vertexShader: vs,
  fragmentShader: 'uniform vec3 c;uniform vec3 s;varying vec3 n;varying vec3 v;varying vec3 wn;void main(){float d=clamp(-dot(n,v),0.,1.);float f=pow(smoothstep(0.,.42,d),2.)*(1.-smoothstep(.42,.55,d));float day=smoothstep(-.35,.45,dot(wn,s));gl_FragColor=vec4(c*f*day*1.1,1.);}'
}));

// Fable（公开版）
const FABLE = new THREE.Vector3(-1.7, 0, 0);
const fable = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 128),
  new THREE.MeshStandardMaterial({ map: await tex(q.get('fable') || 'fable/fable-final.jpg'), roughness: 0.9 }));
fable.position.copy(FABLE); scene.add(fable);
const fa = atmo(0xf2a679); fa.position.copy(FABLE); scene.add(fa);

// Mythos（同源、受限）：地表略带自发光，透过面纱孔洞也看得见
const MYTH = new THREE.Vector3(1.7, 0, 0);
const mtex = await tex(q.get('mythos') || 'mythos/mythos-A-fixed.png');
const mythos = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 128),
  new THREE.MeshStandardMaterial({ map: mtex, roughness: 0.6, metalness: 0.25, emissiveMap: mtex, emissive: 0xffffff, emissiveIntensity: 0.16 }));
mythos.position.copy(MYTH); scene.add(mythos);
const ma = atmo(0xe8b04a); ma.position.copy(MYTH); scene.add(ma);

// 面纱壳：噪声孔洞随 t 开合（阈值慢慢起伏），孔洞边缘一圈金光
const veilU = { time: { value: 0 }, sun: { value: sunDir } };
const noise = `
  vec3 h3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.+2.*fract(sin(p)*43758.5453);}
  float n3(vec3 p){vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
    return mix(mix(mix(dot(h3(i),f),dot(h3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(h3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(h3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
               mix(mix(dot(h3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(h3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(h3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(h3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
  float fbm(vec3 p){float a=.5,v=0.;for(int i=0;i<5;i++){v+=a*n3(p);p*=2.03;a*=.5;}return v;}`;
const veil = new THREE.Mesh(new THREE.SphereGeometry(1.035, 256, 128), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: veilU,
  vertexShader: 'varying vec3 lp;varying vec3 wn;varying vec3 n;varying vec3 v;void main(){lp=position;wn=normalize(mat3(modelMatrix)*normal);n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader: `uniform float time;uniform vec3 sun;varying vec3 lp;varying vec3 wn;varying vec3 n;varying vec3 v;${noise}
    void main(){
      float f=fbm(lp*2.2+vec3(time*.05,0.,-time*.03))*.5+.5;
      // fbm 取值大多落在 .3–.7，阈值放在 .52–.60 之间来回，孔洞才真正「开」到底（之前阈值太高，孔洞只停在过渡带，显示成一片奶油色）
      float th=.60-.08*(.5+.5*sin(time*.55));                         // 孔洞随时间慢慢张开又合上
      float hole=smoothstep(th+.004,th+.016,f);                        // 1 = 孔洞（边界很窄）
      float edge=exp(-pow((f-th-.002)/.006,2.));                       // 孔洞边缘一圈细金线
      float ndl=max(dot(wn,sun),0.);
      float wisp=fbm(lp*5.+vec3(0.,time*.08,0.))*.5+.5;                // 烟纱里缓慢流动的丝缕
      vec3 cloth=vec3(.022,.018,.02)*(.4+.8*ndl)+vec3(.30,.22,.16)*pow(wisp,4.)*.25*(.3+ndl)
                +vec3(.35,.26,.18)*pow(1.-max(dot(n,v),0.),3.)*.5;     // 近黑的烟纱＋边缘丝光
      vec3 col=mix(cloth,vec3(1.,.70,.30)*1.1,edge);
      float a=max((1.-hole)*(.90+.08*wisp),edge*.95);                  // 面纱几乎不透光，只有孔洞里看得见神话
      gl_FragColor=vec4(col,a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
veil.position.copy(MYTH); scene.add(veil);
veil.visible = q.get('veil') !== '0';

const camPos = new THREE.Vector3(), look = new THREE.Vector3();
window.setState = (deg, t) => {
  veilU.time.value = t;
  fable.rotation.y = 0.3 + t * 0.12; mythos.rotation.y = 0.3 + t * 0.12;   // 同源：同样的自转
  veil.rotation.y = t * 0.05;
  // 镜头：从两星同框慢慢推向 Mythos
  const e = Math.min(t / 10, 1), u = e * e * (3 - 2 * e);
  camPos.set(0.2 + u * 1.3, 0.6 - u * 0.2, 9.5 - u * 4.2); look.set(0 + u * 1.6, 0, 0);
  cam.position.copy(camPos); cam.lookAt(look);
  r.render(scene, cam);
};
window.setState(0, +(q.get('t') ?? 0));
window.__ready = true;
</script>
</body></html>
