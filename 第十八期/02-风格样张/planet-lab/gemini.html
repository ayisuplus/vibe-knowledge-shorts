<!doctype html>
<html><head><meta charset="utf-8"><title>Gemini twins test</title>
<style>html,body{margin:0;background:#050510;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<script type="module">
// 双子星试片：?castor=gemini/castor-A-fixed.png&pollux=gemini/pollux-A-fixed.png&bridge=1&t=秒
// Castor（蓝端）与 Pollux（暖端）绕共同质心互转；Gemma 水晶小卫星在外圈；一切由 t 算出
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/addons/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
// 只给水晶用的环境反射（不设成 scene.environment，免得行星也被照亮）
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;

let s = 23; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const sp = []; for (let i = 0; i < 2500; i++) { const a = rnd() * 6.283, b = Math.acos(2 * rnd() - 1), R = 90; sp.push(R * Math.sin(b) * Math.cos(a), R * Math.cos(b), R * Math.sin(b) * Math.sin(a)); }
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xc8cde0, size: 0.12 })));

const SUN = new THREE.Vector3(-9, 6, 26);
const sun = new THREE.DirectionalLight(0xfff6ee, 3.3); sun.position.copy(SUN); scene.add(sun);
scene.add(new THREE.AmbientLight(0x30324a, 0.22));

const loader = new THREE.TextureLoader();
const tex = async (f) => { const t = await loader.loadAsync(f); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; };
const vs = 'varying vec3 n;varying vec3 v;varying vec3 wn;void main(){n=normalize(normalMatrix*normal);wn=normalize(mat3(modelMatrix)*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';
const sunDir = SUN.clone().normalize();
const atmo = (col) => new THREE.Mesh(new THREE.SphereGeometry(1.09, 128, 64), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { c: { value: new THREE.Color(col) }, s: { value: sunDir } }, vertexShader: vs,
  fragmentShader: 'uniform vec3 c;uniform vec3 s;varying vec3 n;varying vec3 v;varying vec3 wn;void main(){float d=clamp(-dot(n,v),0.,1.);float f=pow(smoothstep(0.,.42,d),2.)*(1.-smoothstep(.42,.55,d));float day=smoothstep(-.35,.45,dot(wn,s));gl_FragColor=vec4(c*f*day*1.1,1.);}'
}));
const twin = async (file, col) => {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 128), new THREE.MeshStandardMaterial({ map: await tex(file), roughness: 0.8, metalness: 0 }));
  g.add(m); g.add(atmo(col)); scene.add(g); return { g, m };
};
const castor = await twin(q.get('castor') || 'gemini/castor-A-fixed.png', 0x6fb0ff);
const pollux = await twin(q.get('pollux') || 'gemini/pollux-A-fixed.png', 0xff9a86);

// 光桥：两星之间一缕很淡的紫色光雾（Gemini 渐变的中段 #9476C5），面向镜头的贴片
const bridgeU = { time: { value: 0 } };
const bridge = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: bridgeU,
  vertexShader: 'varying vec2 u;void main(){u=uv*2.-1.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform float time;varying vec2 u;
    void main(){float y=u.y;float x=u.x;
      float band=exp(-y*y*18.)*(1.-x*x*.6);                     // 细长的光带，中间最亮
      float wave=.75+.25*sin(x*9.-time*1.2)*sin(x*4.+time*.7);  // 轻微流动
      float i=band*wave*.32*smoothstep(1.,.75,abs(x));
      gl_FragColor=vec4(vec3(.58,.46,.77)*i,1.);}`
}));
bridge.visible = q.get('bridge') === '1';                    // 默认关：试下来像一条灰杠
scene.add(bridge);

// Gemma：四颗切面宝石（低多边形二十面体，平面着色＋环境反射），带蓝/紫/玫瑰的轻微色调
const GEMS = [
  { c: 0xbfdcff, R: 3.6, w: 0.22, a0: 0.4, y: 0.5, s: 0.16 },
  { c: 0xd9c8ff, R: 4.1, w: -0.17, a0: 2.3, y: -0.6, s: 0.13 },
  { c: 0xffd0d4, R: 3.9, w: 0.19, a0: 4.0, y: 0.25, s: 0.14 },
  { c: 0xe6efff, R: 4.4, w: -0.14, a0: 5.4, y: -0.2, s: 0.11 },
];
// 每颗宝石配一道星芒贴片，按各自相位周期性闪一下（像切面转到对着光的瞬间）
const glintU = { time: { value: 0 } };
const glints = GEMS.map((o, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { time: glintU.time, ph: { value: i * 1.9 }, c: { value: new THREE.Color(o.c) } },
    vertexShader: 'varying vec2 u;void main(){u=uv*2.-1.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: `uniform float time;uniform float ph;uniform vec3 c;varying vec2 u;
      void main(){float r=length(u);
        float flash=pow(max(sin(time*1.6+ph),0.),12.);           // 大部分时间很暗，偶尔一闪
        float base=.18+flash;
        float spike=(exp(-abs(u.x)*70.)+exp(-abs(u.y)*70.))*exp(-r*3.5);
        float i=(exp(-r*30.)*1.5+spike*.9+exp(-r*7.)*.25)*base*smoothstep(1.,.7,r);
        gl_FragColor=vec4(mix(c,vec3(1.),.5)*i,1.);}`
  }));
  scene.add(m); return m;
});
const gems = GEMS.map(o => {
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(o.s * 0.45, 1), new THREE.MeshStandardMaterial({
    color: new THREE.Color(o.c).offsetHSL(0, 0.25, -0.18), metalness: 0.6, roughness: 0.05, flatShading: true,
    envMap: env, envMapIntensity: 1.5, emissive: o.c, emissiveIntensity: 0.04 }));   // 反射调弱，色调加重，近看不再是白块
  m.scale.set(1, 1.35, 1);                                   // 拉长一点，更像切割过的宝石
  scene.add(m); return m;
});

const tmp = new THREE.Vector3(), camPos = new THREE.Vector3(), look = new THREE.Vector3(0, 0, 0);
const TILT = 0.22;                                           // 双星轨道面略倾斜
window.setState = (deg, t) => {
  bridgeU.time.value = t;
  // 双星：间距 3.0，绕质心公转
  // 起点 -0.95：与镜头方位角 c 之和在 8 秒内从 -0.6 走到约 +0.96，不经过 ±π/2，两星不会互相遮挡
  const a = -0.95 + t * 0.16, d = 1.5;
  castor.g.position.set(Math.cos(a) * d, Math.sin(a) * d * Math.sin(TILT), Math.sin(a) * d * Math.cos(TILT));
  pollux.g.position.copy(castor.g.position).multiplyScalar(-1);
  castor.m.rotation.y = t * 0.25; pollux.m.rotation.y = -t * 0.25;   // 镜像般反向自转
  // 光桥：贴片中心在质心，横向拉到两星之间、朝向镜头
  bridge.position.set(0, 0, 0);
  // Gemma：外圈各自公转并自转
  GEMS.forEach((o, i) => {
    const b = o.a0 + t * o.w;
    gems[i].position.set(Math.cos(b) * o.R, o.y + 0.15 * Math.sin(b * 2), Math.sin(b) * o.R);
    gems[i].rotation.set(t * 0.6 + i, t * 0.9 + i * 2, 0);
    glints[i].position.copy(gems[i].position);
  });
  glintU.time.value = t;
  // 镜头：缓慢环绕
  const c = 0.35 + t * 0.035;
  camPos.set(Math.sin(c) * 7.8, 1.6, Math.cos(c) * 7.8); cam.position.copy(camPos); cam.lookAt(look);
  for (const g of glints) g.quaternion.copy(cam.quaternion);
  // 光桥朝向镜头，并沿屏幕上两星连线方向拉伸
  bridge.quaternion.copy(cam.quaternion);
  const p1 = castor.g.position.clone().project(cam), p2 = pollux.g.position.clone().project(cam);
  bridge.rotation.z = Math.atan2((p2.y - p1.y) * H, (p2.x - p1.x) * W);
  bridge.quaternion.copy(cam.quaternion).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), bridge.rotation.z));
  bridge.scale.set(castor.g.position.distanceTo(pollux.g.position) * 1.05, 1.1, 1);
  r.render(scene, cam);
};
window.setState(0, +(q.get('t') ?? 0));
window.__ready = true;
</script>
</body></html>
