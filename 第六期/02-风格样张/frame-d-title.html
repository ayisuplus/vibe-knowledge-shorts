<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* S1 片名：一扇半开的门，门缝里漏出金光 */
  .stage { background: radial-gradient(ellipse 60% 70% at 50% 55%, #1a1410 0%, #0b0908 60%, #050404 100%); }
  .floorlight { position: absolute; left: 520px; top: 880px; width: 1000px; height: 200px;
    background: radial-gradient(ellipse 50% 60% at 50% 0%, rgba(242,207,122,.35), rgba(242,207,122,0)); }
  .title { position: absolute; left: 0; right: 0; text-align: center; }
  .t1 { top: 70px; font-size: 104px; }
  .t2 { top: 210px; font-size: 104px; }
  .t2 .ai { letter-spacing: 2px; }
</style></head>
<body><div class="stage">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0"><g transform="translate(960 1000) scale(1.12) translate(0 20) translate(-960 -1000)">
    <defs>
      <linearGradient id="spill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff3cf" stop-opacity=".95"/><stop offset=".5" stop-color="#f2cf7a" stop-opacity=".55"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2b211a"/><stop offset="1" stop-color="#15100c"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <!-- 门框 -->
    <rect x="770" y="470" width="380" height="440" fill="#120d0a" stroke="#3a2c20" stroke-width="10"/>
    <!-- 门缝里的光 -->
    <rect x="780" y="480" width="190" height="425" fill="#fff1c4"/>
    <polygon points="780,905 970,905 1500,1080 420,1080" fill="url(#spill)" opacity=".35" filter="url(#blur)"/>
    <!-- 门板：半开，透视 -->
    <polygon points="970,480 1140,452 1140,936 970,905" fill="url(#slab)" stroke="#4a3828" stroke-width="3"/>
    <circle cx="1000" cy="700" r="7" fill="#d9a441"/>
    <!-- 门缝溢光 -->
    <rect x="780" y="480" width="190" height="425" fill="#f2cf7a" opacity=".5" filter="url(#blur)"/>
  </g></svg>
  <div class="floorlight"></div>
  <div class="title t1 goldtext">马克思写下的那扇门</div>
  <div class="title t2 goldtext"><span class="ai">AI</span> 打开了一半</div>
  <div class="vignette"></div><div class="grain"></div>
</div></body></html>
