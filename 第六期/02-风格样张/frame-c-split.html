<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* S8 182s：分屏滑杆停在中间，"唯一的区别：机器归谁" */
  .half { position: absolute; top: 0; bottom: 0; background-size: 1920px 1280px; background-position: center 38%; }
  .left  { left: 0; width: 960px; background-image: url("gen/city-dystopia.jpg"); filter: saturate(1.1) contrast(1.05); }
  .right { left: 960px; right: 0; background-image: url("gen/city-utopia.jpg"); background-position: -960px 38%; }
  .left { background-position: 0 38%; }
  .rail { position: absolute; left: 957px; top: 0; bottom: 0; width: 6px;
    background: linear-gradient(180deg, rgba(242,207,122,0), var(--gold-hi) 15%, var(--gold) 85%, rgba(217,164,65,0));
    box-shadow: 0 0 30px rgba(242,207,122,.7); }
  .knob { position: absolute; left: 912px; top: 494px; width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff4cf, var(--gold) 55%, #8f611a); box-shadow: 0 6px 30px rgba(0,0,0,.6), 0 0 40px rgba(242,207,122,.6); }
  .knob::before, .knob::after { content: ""; position: absolute; top: 34px; border: 14px solid transparent; }
  .knob::before { left: 6px; border-right-color: rgba(60,40,10,.75); }
  .knob::after { right: 6px; border-left-color: rgba(60,40,10,.75); }
  .side { position: absolute; top: 70px; font-family: "Sans"; font-weight: 700; font-size: 34px; letter-spacing: 6px; padding: 8px 22px; border-radius: 10px; }
  .side.l { left: 70px; color: var(--neon-c); background: rgba(5,10,18,.6); text-shadow: 0 0 18px rgba(45,226,230,.7); }
  .side.r { right: 70px; color: #3a2a0a; background: rgba(255,248,236,.75); }
  .big { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 92px; z-index: 30; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55) 45%, rgba(0,0,0,.78)); }
  .band { position: absolute; left: 0; right: 0; top: 735px; height: 170px; background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,0)); }
</style></head>
<body><div class="stage">
  <div class="half left"></div>
  <div class="half right"></div>
  <div class="shade"></div>
  <div class="rail"></div><div class="knob"></div>
  <div class="side l">机器归少数人</div>
  <div class="side r">机器归所有人</div>
  <div class="band"></div>
  <div class="big goldtext">唯一的区别：机器归谁</div>
  <div class="vignette"></div><div class="grain"></div>
</div></body></html>
