<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>样张 B · 255 天花板</title>
<link rel="stylesheet" href="style.css">
<style>
  .photo { position: absolute; left: 96px; top: 110px; width: 880px; height: 660px; border-radius: 26px; overflow: hidden;
    background: url("gen/hero-plus20.png") -1018px -10px / 2458px auto no-repeat; box-shadow: 0 24px 60px rgba(40,30,20,.25); }
  .lens { position: absolute; left: 380px; top: 192px; width: 300px; height: 300px; border-radius: 50%; z-index: 5;
    box-shadow: 0 0 0 10px #fffdf9, 0 18px 50px rgba(40,30,20,.35); overflow: hidden; background: #fff; }
  .lens .px { position: absolute; top: 0; bottom: 0; width: 150px; background: #fff; }
  .lens .px.a { left: 0; } .lens .px.b { left: 150px; border-left: 3px solid #e3ddd3; }
  .lens .lab { position: absolute; bottom: 64px; font-family: "Mono"; font-weight: 700; font-size: 44px; color: var(--ink-3); }
  .lens .lab.a { left: 58px; } .lens .lab.b { left: 206px; }
  .lens .grid { position: absolute; inset: 0; background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 30px), repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 30px); }
  .wire { position: absolute; left: 680px; top: 330px; width: 420px; height: 3px; background: linear-gradient(90deg, #fffdf9, rgba(255,253,249,.2)); z-index: 4; }

  .chart { position: absolute; left: 1060px; top: 110px; width: 760px; height: 690px; border-radius: 26px; background: #fffdf9;
    box-shadow: 0 24px 60px rgba(40,30,20,.16); }
  .ceil { position: absolute; left: 60px; right: 40px; height: 4px; background: var(--clip); box-shadow: 0 0 18px rgba(216,58,46,.55); }
  .ceil-l { position: absolute; left: 0; width: 66px; text-align: center; font-family: "Mono"; font-weight: 700; font-size: 26px; color: var(--clip); }
  .bar { position: absolute; width: 74px; border-radius: 8px 8px 0 0; }
  .bar { z-index: 1; }
  .bar.r { background: var(--r); } .bar.g { background: var(--g); } .bar.b { background: var(--b); }
  .mark { position: absolute; width: 86px; height: 0; border-top: 4px dashed rgba(35,38,43,.55); z-index: 2; }
  .ghost { position: absolute; width: 74px; border: 3px dashed; border-bottom: none; border-radius: 8px 8px 0 0; box-sizing: border-box; opacity: .38; }
  .ghost.r { border-color: var(--r); } .ghost.g { border-color: var(--g); } .ghost.b { border-color: var(--b); }
  .over { position: absolute; width: 74px; box-sizing: border-box; border-radius: 8px 8px 0 0; opacity: .5;
    background: repeating-linear-gradient(45deg, rgba(216,58,46,.35) 0 6px, rgba(216,58,46,0) 6px 12px); border: 2px dashed var(--clip); border-bottom: none; }
  .would { position: absolute; width: 74px; text-align: center; font-family: "Mono"; font-size: 26px; color: var(--clip); text-decoration: line-through; opacity: .8; }
  .now { position: absolute; width: 74px; text-align: center; font-family: "Mono"; font-weight: 700; font-size: 28px; color: #fff; }
  .glab { position: absolute; top: 566px; width: 300px; text-align: center; font-family: "Mono"; font-size: 28px; color: var(--ink-2); line-height: 1.35; }
  .glab b { font-family: "Sans"; font-weight: 700; color: var(--ink); font-size: 30px; }
  .axis { position: absolute; left: 40px; right: 40px; top: 538px; height: 2px; background: #d8d1c5; }
  .axisnote { position: absolute; right: 44px; top: 30px; font-family: "Sans"; font-weight: 500; font-size: 20px; color: var(--ink-3); }
</style></head>
<body><div class="stage">
  <div class="photo"></div>
  <div class="wire"></div>
  <div class="lens"><div class="px a"></div><div class="px b"></div><div class="grid"></div><div class="lab a">A</div><div class="lab b">B</div></div>
  <div class="chart" id="chart">
    <div class="axis"></div><div class="axisnote">只画 200 以上</div>
  </div>
  <div class="slider"><div class="name">亮度</div><div class="track"><div class="zero"></div><div class="fill" style="width:14%"></div><div class="knob" style="left:64%"></div></div><div class="val">+20</div></div>
  <div class="tag">简化演示</div>
  <div class="vignette"></div><div class="grain"></div>
  <div class="cap"><span class="t">超过 255 的，一律<em>算 255</em></span></div>
</div>
<script>
  // 云里两个真实像素（hero.jpg 第 166 行，第 905、906 列），各 +20
  const A = [237, 243, 247], B = [243, 248, 251], add = 20;
  const chart = document.getElementById("chart");
  const y0 = 538, yTop = 90, vMin = 200, vMax = 285;              // 纵轴只画 200–285
  const Y = v => y0 - (v - vMin) / (vMax - vMin) * (y0 - yTop);
  const el = (cls, css, txt) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); if (txt != null) d.textContent = txt; chart.appendChild(d); return d; };
  el("ceil", { top: Y(255) - 2 + "px" }); el("ceil-l", { top: Y(255) - 16 + "px" }, "255");
  [[A, 70, "A"], [B, 410, "B"]].forEach(([px, gx, name]) => {
    px.forEach((v, i) => {
      const k = "rgb"[i], x = gx + i * 96, w = v + add, c = Math.min(255, w);
      el("mark", { left: x - 6 + "px", top: Y(v) - 2 + "px" });
      el("bar " + k, { left: x + "px", top: Y(c) + "px", height: y0 - Y(c) + "px" });
      if (w > 255) { el("over", { left: x + "px", top: Y(w) + "px", height: Y(255) - Y(w) + "px" }); el("would", { left: x + "px", top: Y(w) - 34 + "px" }, w); }
      el("now", { left: x + "px", top: Y(c) + 12 + "px" }, c);
    });
    const g = el("glab", { left: gx - 12 + "px" });
    g.innerHTML = `<b>像素 ${name}</b><br>原来 ${px.join(" ")}<br>现在 255 255 255`;
  });
</script>
</body></html>
