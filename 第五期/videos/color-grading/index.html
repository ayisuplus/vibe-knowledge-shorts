      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f1ea; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Sans", sans-serif; background: #f5f1ea; }
      .layer { position: absolute; inset: 0; }
      #bgfill { position: absolute; inset: 0; background: radial-gradient(ellipse 65% 60% at 50% 42%, #fbf8f3 0%, rgba(251, 248, 243, 0) 70%), linear-gradient(#f5f1ea, #eee8de); }
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      svg text { font-family: "Sans"; font-weight: 700; }
      svg text.mono, .mono { font-family: "Mono"; font-variant-numeric: tabular-nums; }
      .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 72% at 50% 45%, rgba(0, 0, 0, 0) 58%, rgba(40, 32, 24, 0.16) 100%); }
      .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.05; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 1.4 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

      #hud { pointer-events: none; }
      .t { position: absolute; display: block; visibility: hidden; color: #23262b; white-space: nowrap; font-family: "Sans"; font-weight: 700; }
      .t em { font-style: normal; color: #ec7a2c; }
      .sv-name { font-size: 32px; fill: #23262b; }
      .sv-val { font-family: "Mono"; font-size: 34px; fill: #ec7a2c; font-weight: 700; }

      /* 像素小卡 */
      .pxcard { position: absolute; visibility: hidden; padding: 18px 26px; border-radius: 18px; background: #fffdf9; transform-origin: 0 0;
        box-shadow: 0 14px 40px rgba(40, 30, 20, 0.2); font-family: "Mono"; font-size: 40px; line-height: 1.32; color: #23262b; }
      .pxcard .row { display: flex; gap: 22px; align-items: baseline; white-space: nowrap; }
      .pxcard .k { font-weight: 700; width: 28px; }
      .pxcard .k.r { color: #e5574a; } .pxcard .k.g { color: #34a866; } .pxcard .k.b { color: #3a8edb; }
      .pxcard .title { font-family: "Sans"; font-weight: 500; font-size: 24px; color: #5d636c; margin-bottom: 6px; letter-spacing: 2px; }
      .pxcard .m { color: #ec7a2c; font-weight: 700; } .pxcard .q { color: #9aa0a8; } .pxcard .o { font-weight: 700; }
      .pxcard.big { font-size: 48px; }

      /* 简化演示标签 */
      .tag { font-weight: 500; font-size: 26px; color: #5d636c; padding: 6px 16px; border: 2px solid rgba(93, 99, 108, 0.45); border-radius: 10px; background: rgba(250, 247, 242, 0.75); letter-spacing: 2px; }

      /* 字幕预览（?caps=1）。成片不显示，交付 SRT */
      .cap { position: absolute; z-index: 9; left: 160px; right: 160px; top: 914px; display: flex; flex-direction: column; align-items: center; text-align: center; visibility: hidden; }
      .cap b { display: inline-block; font-size: 54px; font-weight: 700; line-height: 1.3; letter-spacing: 1px; color: #23262b; padding: 4px 22px; border-radius: 14px; background: rgba(250, 247, 242, 0.88); box-shadow: 0 6px 24px rgba(40, 30, 20, 0.1); }
      .cap b em { font-style: normal; color: #ec7a2c; }
      .cap i { display: block; margin-top: 8px; font-style: normal; font-size: 26px; font-weight: 500; letter-spacing: 1px; color: #5d636c; padding: 2px 12px; border-radius: 8px; background: rgba(250, 247, 242, 0.8); }

      /* 大字 */
      .title { font-size: 112px; letter-spacing: 8px; line-height: 1.15; color: #23262b; }
      .sub { font-size: 44px; font-weight: 500; letter-spacing: 10px; color: #5d636c; }
      .q { font-size: 34px; }
      .chain { font-size: 30px; font-weight: 700; color: #23262b; }
      .lab { font-size: 28px; font-weight: 500; letter-spacing: 2px; color: #5d636c; }
      .big { font-size: 64px; }
      .huge { font-size: 96px; }
      .wh { color: #fff; }
      .tipcard { padding: 26px 34px; border-radius: 22px; background: #fffdf9; box-shadow: 0 16px 44px rgba(40, 30, 20, 0.18); font-size: 40px; white-space: nowrap; }
      .tipcard .n { display: inline-block; width: 58px; height: 58px; margin-right: 20px; border-radius: 50%; background: #ec7a2c; color: #fff; text-align: center; line-height: 58px; font-family: "Mono"; font-size: 34px; vertical-align: 4px; }
      .tipcard small { display: block; margin: 8px 0 0 78px; font-size: 26px; font-weight: 500; color: #5d636c; }
    </style>
