<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>一棵树，长出整个计算机世界 · 技术样片</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "../assets/vendor/three.module.js",
          "three/addons/": "../assets/vendor/addons/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "VibeSerif"; src: url("../assets/fonts/NotoSerifSC-VF.ttf"); font-weight: 200 900; }
      @font-face { font-family: "VibeSans"; src: url("../assets/fonts/NotoSansSC-VF.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4efe6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4efe6; font-family: "VibeSans", sans-serif; }
      .layer { position: absolute; inset: 0; }
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #hud { pointer-events: none; }
      .t { position: absolute; left: 0; right: 0; top: 96px; text-align: center; visibility: hidden; font-family: "VibeSerif"; font-weight: 700; font-size: 64px; letter-spacing: 4px; color: #23262b; }
      .t em { font-style: normal; color: #c26f30; }
      .node { position: absolute; left: 0; top: 0; visibility: hidden; padding: 6px 18px; border-radius: 999px; background: rgba(255, 250, 238, 0.92); color: #23262b; font-family: "VibeSans"; font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(90, 60, 20, 0.25); border: 2px solid #f2c14e; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div id="stage" class="layer clip" data-start="0" data-duration="5" data-track-index="0">
        <canvas id="gl" width="1920" height="1080"></canvas>
      </div>
      <div id="hud" class="layer clip" data-start="0" data-duration="5" data-track-index="1"></div>
    </div>
    <script>
      // 时间线在这里先注册（框架要在加载时就找到它）；3D 模块加载后往里填驱动 tween
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="../assets/js/spike.js"></script>
  </body>
</html>
