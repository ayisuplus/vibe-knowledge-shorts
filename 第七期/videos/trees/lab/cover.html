<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>封面背景</title>
    <!-- 封面：用 3D 场景按封面画幅直接渲染（?a=43 → 1440×1080，?a=34 → 1080×1440），标题叠在上面 -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "../assets/vendor/three.module.js", "three/addons/": "../assets/vendor/addons/" } }
    </script>
    <style>
      @font-face { font-family: "VibeSerif"; src: url("../assets/fonts/NotoSerifSC-VF.ttf"); font-weight: 200 900; }
      @font-face { font-family: "VibeSans"; src: url("../assets/fonts/NotoSansSC-VF.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: #f4efe6; }
      #root { position: relative; overflow: hidden; }
      #gl { position: absolute; left: 0; top: 0; display: block; }
      .title { position: absolute; left: 0; right: 0; text-align: center; font-family: "VibeSerif"; font-weight: 900; color: #23262b; line-height: 1.22; letter-spacing: 6px;
        text-shadow: 0 0 24px rgba(251, 246, 236, 0.95), 0 0 6px rgba(251, 246, 236, 1); }
      .title em { font-style: normal; color: #c26f30; }
      .kw { position: absolute; left: 0; right: 0; text-align: center; font-family: "VibeSans"; font-weight: 700; color: #6b4e3a; letter-spacing: 3px; }
      .kw span { display: inline-block; padding: 6px 18px; margin: 0 6px 10px; border-radius: 999px; background: rgba(255, 250, 238, 0.92); border: 2px solid #d9c49a; }
    </style>
  </head>
  <body>
    <div id="root"><canvas id="gl"></canvas><div id="hud"></div></div>
    <script>
      window.__timelines = { main: gsap.timeline({ paused: true }) };
    </script>
    <script type="module">
      import { buildWorld } from "../assets/js/world.js";
      const portrait = /a=34/.test(location.search);
      const w = portrait ? 1080 : 1440, h = portrait ? 1440 : 1080;
      const root = document.getElementById("root"), cv = document.getElementById("gl");
      root.style.width = cv.style.width = `${w}px`; root.style.height = cv.style.height = `${h}px`;
      const W = buildWorld(cv, { seed: 7, width: w, height: h });
      const cam = portrait ? { pos: [7.2, 3.4, 35.5], tgt: [0, 3.4, 0] } : { pos: [6.6, 2.4, 22.5], tgt: [0, 2.35, 0] };
      const hud = document.getElementById("hud");
      hud.innerHTML = portrait
        ? `<div class="title" style="top:96px;font-size:118px">一棵树，<br><span style="font-size:96px">长出整个<em>计算机世界</em></span></div>
           <div class="kw" style="top:392px;font-size:34px"><span>二叉搜索树</span><span>红黑树</span><span>语法树</span><br><span>决策树</span><span>随机森林</span></div>`
        : `<div class="title" style="top:54px;font-size:100px">一棵树，长出整个<em>计算机世界</em></div>
           <div class="kw" style="top:206px;font-size:30px"><span>二叉搜索树</span><span>红黑树</span><span>语法树</span><span>决策树</span><span>随机森林</span></div>`;
      const frame = () => W.render({ grow: 1, leaf: 1, rootGrow: 1, lit: 1, bright: 0.6, cam });
      window.__timelines.main.to({}, { duration: 1, onUpdate: frame });
      frame();
    </script>
  </body>
</html>
