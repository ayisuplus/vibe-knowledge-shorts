<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>为什么一年比一年过得快 · 风格样张</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "../assets/vendor/three.module.js",
          "three/addons/": "../assets/vendor/addons/"
        }
      }
    </script>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3">
      <div id="stage" class="layer clip" data-start="0" data-duration="3" data-track-index="0">
        <canvas id="gl" width="1920" height="1080"></canvas>
      </div>
      <div id="hud" class="layer clip" data-start="0" data-duration="3" data-track-index="1"></div>
    </div>
    <script>
      // 时间线先在这里注册；3D 模块加载完再往里填驱动 tween
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="../assets/js/style.js"></script>
  </body>
</html>
