<style>

<body>
<div id="root">
<div class="page">
  <div class="src">《天工开物·乃服》· 结花本</div>
  <div class="rule"></div>
  <div class="q">
    <p>画师先画何等花色于纸上，</p>
    <p>结本者以丝线随画量度，</p>
    <p>算计分寸杪忽而结成之。</p>
    <p>张悬花楼之上，<span class="hl"><svg viewBox="0 0 300 70" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="M14 40 C6 12 120 2 244 8 S298 34 280 54 S160 72 58 64 S2 58 14 30" fill="none" stroke="#f0c15a" stroke-width="3.5" stroke-linecap="round"/></svg>即织者不知成何花色，</span></p>
    <p>穿综带经，随其尺寸度数提起衢脚，</p>
    <p>梭过之后居然花现。</p>
  </div>
  <div class="gloss"><svg viewBox="0 0 64 36"><path vector-effect="non-scaling-stroke" d="M62 22 C46 8 22 8 6 20 M6 20 L18 12 M6 20 L16 30" fill="none" stroke="#f0c15a" stroke-width="3" stroke-linecap="round"/></svg>织的人，不知道织出来是什么花</div>
</div>
<div class="mode">暗 靛 金 丝 · 样 张 B</div>
<div class="tag">明 · 1637 · 《天工开物》</div>
<div class="caption">1637 年，<em>宋应星</em>这样写花楼织机</div>
<div class="note">原文 · 简体转写</div>
