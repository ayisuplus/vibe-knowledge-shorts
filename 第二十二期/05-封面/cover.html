<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>loading</title>
<script type="importmap">{ "imports": { "three": "../videos/anxiety-3d/assets/vendor/three.module.js", "three/addons/": "../videos/anxiety-3d/assets/vendor/addons/" } }</script>
<style>
@font-face{font-family:NotoSC;src:url(../videos/anxiety-3d/assets/fonts/NotoSansSC-VF.ttf);font-weight:100 900}
@font-face{font-family:NotoSerifSC;src:url(../videos/anxiety-3d/assets/fonts/NotoSerifSC-VF.ttf);font-weight:200 900}
*{box-sizing:border-box} html,body{margin:0;overflow:hidden;background:#020102}
#gl{position:absolute;inset:0;display:block}
.t{position:absolute;left:0;right:0;text-align:center;font-family:NotoSerifSC,serif;font-weight:900;color:#fff4dc;line-height:1.16;text-shadow:0 4px 24px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.9)}
.t .hl{color:#ff4a36}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="t" id="t">焦虑，是怎么变成<br><span class="hl">一门生意</span>的？</div>
<script type="module">
// 封面复用片里的同一份道具代码：报警器点着发动机，价签从旁边飞过。
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mkAlarm, gearGeo, M, tagTextures, mkTag } from "../videos/anxiety-3d/assets/js/rig.js";
await Promise.all(["900 124px NotoSerifSC", "900 200px NotoSerifSC"].map((f) => document.fonts.load(f, "焦虑生意限时课程")));
const a = new URLSearchParams(location.search).get("a") || "43", W = a === "43" ? 1440 : 1080, H = a === "43" ? 1080 : 1440, dpr = window.devicePixelRatio || 1;
const cv = document.getElementById("gl"), renderer = new THREE.WebGLRenderer({ canvas: cv, preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(dpr); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020102);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .55;
scene.add(new THREE.HemisphereLight(0xffe7d0, 0x200806, .9));
const key = new THREE.DirectionalLight(0xfff0dd, 2.4); key.position.set(-5, 7, 9); scene.add(key);
const red = new THREE.PointLight(0xff3020, 10, 60); red.position.set(0, 0, 4); scene.add(red);
const cam = new THREE.PerspectiveCamera(36, W / H, .05, 300); cam.position.set(1.2, a === "43" ? 2.2 : 2.6, 17); cam.lookAt(0, a === "43" ? 1.4 : 1.6, 0);
const w = { reg: (o) => { scene.add(o); return o; }, tex: (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; } };
const alarm = mkAlarm(w); alarm.set(0, { x: 0, y: a === "43" ? -.6 : -1.1, z: 1.4, s: a === "43" ? .95 : .92, lit: .62, ry: -.16, rx: .06 });
const geo = gearGeo(2.6, 18);
for (const [x, y, z, s, m] of a === "43" ? [[-6.4, 1.2, -3, 1, M.iron], [6.4, 1.4, -3, 1, M.steel], [-9, -4, -6, 1.4, M.steel], [9.6, -4, -6, 1.4, M.iron]] : [[-4.4, 2, -3, .9, M.iron], [4.6, 2.2, -3, .9, M.steel], [-4.8, -5.4, -4, 1.1, M.steel], [5, -5.4, -4, 1.1, M.iron]]) { const g = new THREE.Mesh(geo, m); g.position.set(x, y, z); g.scale.setScalar(s); g.rotation.z = x * .7; scene.add(g); }
const T = tagTextures(w);
for (const [x, y, z, r, s] of a === "43" ? [[-4.5, -1.8, 3, .3, .72], [4.6, -2, 3, -.26, .72]] : [[-2.7, 2.1, 3, .3, .5], [2.8, 1.9, 3, -.26, .5]]) { const t = mkTag(w, T, 4.2); t.position.set(x, y, z); t.rotation.set(.2 * r, r, r); t.scale.setScalar(s); }
const comp = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W * dpr, H * dpr, { type: THREE.HalfFloatType, samples: 4 })); comp.setPixelRatio(dpr); comp.setSize(W, H);
comp.addPass(new RenderPass(scene, cam)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .5, .45, .92)); comp.addPass(new OutputPass()); comp.render();
// 标题：缩到 300px 高仍要能读
const t = document.getElementById("t");
if (a === "43") { t.style.top = "56px"; t.style.fontSize = "126px"; } else { t.style.top = "110px"; t.style.fontSize = "112px"; }
document.title = "ready";
</script>
</body>
</html>
