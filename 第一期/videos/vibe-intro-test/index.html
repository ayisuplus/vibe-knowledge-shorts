<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Vibe 知识大赏 · 片头测试</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "NotoSansSC";
        src: url("assets/fonts/NotoSansSC-Bold.otf") format("opentype");
        font-weight: 700;
      }
      @font-face {
        font-family: "NotoSansSC";
        src: url("assets/fonts/NotoSansSC-Medium.otf") format("opentype");
        font-weight: 500;
      }
      :root {
        --bg: #0d1020;
        --ink: #f4f1ea;
        --sun: #ffd34d;
        --coral: #ff6b5a;
        --mint: #5ee6c8;
        --sky: #7aa2ff;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "NotoSansSC", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 55%, #1b2142 0%, var(--bg) 62%);
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      /* 背景点阵网格 */
      #grid {
        background-image: radial-gradient(rgba(244, 241, 234, 0.16) 1.6px, transparent 1.6px);
        background-size: 48px 48px;
        opacity: 0;
      }
      #glow {
        display: grid;
        place-items: center;
      }
      #glow-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--sun);
        box-shadow: 0 0 40px 12px rgba(255, 211, 77, 0.55);
      }
      #bulb-wrap {
        display: grid;
        place-items: center;
      }
      #bulb {
        width: 520px;
        height: 520px;
        overflow: visible;
      }
      #bulb path,
      #bulb ellipse,
      #bulb line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* 学科标签 */
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        width: 220px;
        height: 84px;
        margin-left: -110px;
        margin-top: -42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 42px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--bg);
      }
      /* 标题 */
      #title-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      #flash {
        background: var(--ink);
        opacity: 0;
      }
      #title {
        display: flex;
        align-items: baseline;
        gap: 36px;
        margin: 0;
        font-size: 168px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      #title-vibe {
        display: block;
        color: var(--sun);
        font-style: italic;
      }
      #title-main {
        display: block;
      }
      #underline {
        display: block;
        width: 960px;
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--coral), var(--sun), var(--mint));
        transform-origin: left center;
      }
      #subtitle {
        display: block;
        margin: 0;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: 12px;
        color: rgba(244, 241, 234, 0.82);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="12"
    >
      <audio
        id="music"
        src="assets/music.mp3"
        data-start="0"
        data-duration="12"
        data-track-index="9"
        data-volume="1"
      ></audio>

      <div id="grid" class="layer clip" data-start="0" data-duration="12" data-track-index="0"></div>

      <div id="glow" class="layer clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div id="glow-dot"></div>
      </div>

      <!-- 线稿灯泡：一笔画出，内部是原子轨道 -->
      <div id="bulb-wrap" class="layer clip" data-start="0" data-duration="10.1" data-track-index="2">
        <svg id="bulb" viewBox="0 0 520 520">
          <path
            id="bulb-glass"
           
            stroke="#f4f1ea"
            stroke-width="7"
            d="M200 372 C200 330 140 300 140 220 A120 120 0 1 1 380 220 C380 300 320 330 320 372 Z"
          />
          <path id="bulb-base" stroke="#f4f1ea" stroke-width="7" d="M206 400 H314 M214 428 H306 M232 456 H288" />
          <ellipse id="orbit-a" cx="260" cy="214" rx="86" ry="30" stroke="#5ee6c8" stroke-width="5" />
          <ellipse id="orbit-b" cx="260" cy="214" rx="86" ry="30" stroke="#ff6b5a" stroke-width="5" transform="rotate(60 260 214)" />
          <ellipse id="orbit-c" cx="260" cy="214" rx="86" ry="30" stroke="#7aa2ff" stroke-width="5" transform="rotate(-60 260 214)" />
          <circle id="nucleus" cx="260" cy="214" r="14" fill="#ffd34d" />
          <line id="ray-1" x1="260" y1="40" x2="260" y2="4" stroke="#ffd34d" stroke-width="7" />
          <line id="ray-2" x1="118" y1="98" x2="92" y2="72" stroke="#ffd34d" stroke-width="7" />
          <line id="ray-3" x1="402" y1="98" x2="428" y2="72" stroke="#ffd34d" stroke-width="7" />
          <line id="ray-4" x1="70" y1="220" x2="34" y2="220" stroke="#ffd34d" stroke-width="7" />
          <line id="ray-5" x1="450" y1="220" x2="486" y2="220" stroke="#ffd34d" stroke-width="7" />
        </svg>
      </div>

      <!-- 学科标签，跟着鼓点一个个弹出 -->
      <div id="chips" class="layer clip" data-start="4" data-duration="6.1" data-track-index="3">
        <div class="chip" id="chip-0" style="background: #ffd34d">物理</div>
        <div class="chip" id="chip-1" style="background: #5ee6c8">生物</div>
        <div class="chip" id="chip-2" style="background: #ff6b5a">AI</div>
        <div class="chip" id="chip-3" style="background: #7aa2ff">宇宙</div>
        <div class="chip" id="chip-4" style="background: #f4f1ea">数学</div>
        <div class="chip" id="chip-5" style="background: #ffd34d">历史</div>
        <div class="chip" id="chip-6" style="background: #5ee6c8">化学</div>
        <div class="chip" id="chip-7" style="background: #ff6b5a">艺术</div>
      </div>

      <div id="title-card" class="layer clip" data-start="9.7" data-duration="2.3" data-track-index="4">
        <h1 id="title"><span id="title-vibe">Vibe</span><span id="title-main">知识大赏</span></h1>
        <div id="underline"></div>
        <p id="subtitle">用代码，讲清一个知识</p>
      </div>

      <div id="flash" class="layer clip" data-start="9.7" data-duration="0.6" data-track-index="5"></div>
    </div>

    <script>
      // 配乐里检测到的重拍（秒），动画节点都对齐到这些时间
      const BEATS = [1.39, 2.32, 4.2, 5.13, 5.6, 5.92, 6.69, 6.99, 7.48, 7.94, 9.8, 11.22];
      const HIT = 9.8; // 主重拍：标题砸入
      const tl = gsap.timeline({ paused: true });

      // 线条"一笔画出"：按真实路径长度设置虚线，再把偏移从全长推到 0
      function drawIn(sel, vars, at) {
        const len = Math.ceil(document.querySelector(sel).getTotalLength()) + 2;
        tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, ...vars }, at);
      }

      // 0 – 1.4s：一个光点出现、呼吸
      tl.fromTo("#glow-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 0.15);
      tl.to("#glow-dot", { scale: 1.6, duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.78);

      // 1.39s 第一拍：光点拉成线，开始画灯泡
      tl.to("#glow-dot", { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.34);
      drawIn("#bulb-glass", { duration: 1.9, ease: "power2.inOut" }, BEATS[0]);
      drawIn("#bulb-base", { duration: 0.8, ease: "power2.out" }, BEATS[0] + 1.3);

      // 2.32s 第二拍：网格亮起，原子轨道转出来
      tl.to("#grid", { opacity: 1, duration: 1.2, ease: "power1.out" }, BEATS[1]);
      ["#orbit-a", "#orbit-b", "#orbit-c"].forEach((sel, i) => {
        drawIn(sel, { duration: 1.0, ease: "power3.out" }, BEATS[1] + 0.3 + i * 0.25);
      });
      tl.fromTo("#nucleus", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, BEATS[1] + 1.2);

      // 4.2s：灯泡亮起来，光芒射出
      for (let i = 1; i <= 5; i++) {
        drawIn(`#ray-${i}`, { duration: 0.35, ease: "power2.out" }, BEATS[2] + (i - 1) * 0.04);
      }
      tl.to("#bulb-glass", { stroke: "#ffd34d", duration: 0.25 }, BEATS[2]);
      tl.to("#bulb", { scale: 0.62, y: -20, duration: 0.9, ease: "power3.inOut" }, BEATS[2] + 0.1);

      // 学科标签绕灯泡排一圈，每个重拍弹出一个
      const CX = 960, CY = 520, RX = 640, RY = 330;
      const chipTimes = [BEATS[2], BEATS[3], BEATS[4], BEATS[5], BEATS[6], BEATS[7], BEATS[8], BEATS[9]];
      const CHIP_LAYER_START = 4; // #chips 的 data-start，子元素的位置用全局时间写
      chipTimes.forEach((t, i) => {
        const a = -Math.PI / 2 + (i / chipTimes.length) * Math.PI * 2 + 0.2;
        const x = CX + Math.cos(a) * RX;
        const y = CY + Math.sin(a) * RY;
        const tilt = (i % 2 ? 1 : -1) * (3 + (i % 3) * 2);
        tl.fromTo(
          `#chip-${i}`,
          { x: CX, y: CY, scale: 0, rotation: 0, opacity: 0 },
          { x, y, scale: 1, rotation: tilt, opacity: 1, duration: 0.45, ease: "back.out(1.8)" },
          t
        );
        // 停留时轻微漂浮
        tl.to(`#chip-${i}`, { y: y - 10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + 0.45);
      });

      // 9.3 – 9.8s：所有元素被吸回中心
      tl.to(".chip", { x: CX, y: CY, scale: 0.2, opacity: 0, rotation: 0, duration: 0.45, ease: "power3.in", stagger: 0.02 }, HIT - 0.55);
      tl.to("#bulb", { scale: 0, opacity: 0, duration: 0.4, ease: "power3.in" }, HIT - 0.45);

      // 9.8s 主重拍：闪白 + 标题砸入
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.6, duration: 0.06 }, HIT - 0.06);
      tl.to("#flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, HIT);
      tl.fromTo("#title", { scale: 1.6, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, HIT - 0.04);
      tl.fromTo("#title-vibe", { x: -60 }, { x: 0, duration: 0.7, ease: "expo.out" }, HIT);
      tl.fromTo("#title-main", { x: 60 }, { x: 0, duration: 0.7, ease: "expo.out" }, HIT);
      tl.fromTo("#grid", { scale: 1 }, { scale: 1.08, duration: 2.2, ease: "power1.out" }, HIT);

      // 11.22s 结尾和弦：下划线划过 + 副标题浮现
      tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, BEATS[11] - 0.5);
      tl.fromTo("#subtitle", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, BEATS[11] - 0.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
