<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 A · 深海数据 · 引文</title>
<style>
@font-face{font-family:NotoSC;src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900;font-display:block}
@font-face{font-family:NotoSerifSC;src:url("assets/fonts/NotoSerifSC-VF.ttf") format("truetype");font-weight:200 900;font-display:block}
@font-face{font-family:WenKai;src:url("assets/fonts/LXGWWenKai-Regular.ttf") format("truetype");font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#050a14}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(80% 66% at 50% 38%,#0c2147 0%,#071632 52%,#04080f 100%)}
.mode{position:absolute;left:72px;top:52px;font-family:NotoSC;font-weight:700;font-size:15px;letter-spacing:.42em;color:#4c6a97}
.tag{position:absolute;left:50%;top:36px;transform:translateX(-50%);padding:10px 32px;border:2px solid rgba(139,172,224,.55);border-radius:999px;font-family:NotoSC;font-weight:600;font-size:24px;letter-spacing:.14em;color:#dbe7fb;background:rgba(20,44,84,.72);white-space:nowrap}
.note{position:absolute;left:0;right:0;top:788px;text-align:center;font-family:NotoSC;font-weight:500;font-size:27px;letter-spacing:.05em;color:#8ea8cf}
.note b{color:#3b82f6;font-weight:700}
.caption{position:absolute;left:0;right:0;top:918px;height:64px;line-height:64px;text-align:center;font-family:NotoSC;font-weight:800;font-size:46px;letter-spacing:.04em;color:#eaf2ff}
.caption em{font-style:normal;color:#3b82f6}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(90,140,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,140,220,.07) 1px,transparent 1px);background-size:64px 64px}.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(78% 72% at 50% 44%,transparent 52%,rgba(0,0,0,.5) 100%)}

.page{position:absolute;left:300px;top:150px;width:1320px;height:560px;border-radius:22px;background:linear-gradient(180deg,rgba(16,34,66,.94),rgba(8,20,44,.94));border:2px solid rgba(102,140,204,.55);box-shadow:0 34px 90px rgba(0,0,0,.6)}
.q{position:absolute;left:120px;right:120px;top:96px;font-family:NotoSerifSC;font-weight:700;font-size:76px;line-height:1.5;color:#eaf2ff;letter-spacing:.05em;text-align:center}
.hl{position:relative;display:inline-block;color:#3b82f6;font-weight:900}
.hl svg{position:absolute;left:-46px;top:-20px;width:calc(100% + 92px);height:calc(100% + 40px);overflow:visible}
.src{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-family:NotoSC;font-weight:600;font-size:25px;letter-spacing:.3em;color:#4c6a97}
.deco{position:absolute;left:96px;bottom:52px;font-family:WenKai;font-size:34px;color:#3b82f6;transform:rotate(-4deg)}
.deco svg{position:absolute;left:-66px;top:10px;width:56px;height:34px;overflow:visible}
</style>
</head>
<body>
<div id="root">
<div class="page">
  <div class="q">
    <p>被爱的东西，</p>
    <p>会<span class="hl"><svg viewBox="0 0 300 70" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="M14 40 C6 12 120 2 244 8 S298 34 280 54 S160 72 58 64 S2 58 14 30" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/></svg>疯狂长出血肉</span>。</p>
  </div>
  <div class="src">二次元圈流传 · 类比</div>
  <div class="deco"><svg viewBox="0 0 56 34"><path vector-effect="non-scaling-stroke" d="M28 4 C46 8 52 20 48 30 C34 34 8 32 4 22 C8 8 18 4 28 4 Z" fill="none" stroke="#3b82f6" stroke-width="3"/></svg>被爱，才有血肉</div>
</div>
<div class="mode">样张 A · 深海数据</div>
<div class="tag">题眼 · 金句</div>
<div class="caption">被爱的东西，会<em>疯狂长出血肉</em>。</div>
<div class="note">全片题眼 · 圈内流传语（无唯一出处）· 片中标注<b>类比</b></div>
<div class="grid"></div><div class="vig"></div>
</div>
</body>
</html>
